[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbmask"
version = "0.1.1"
description = "An open-source toolkit to discover and mask sensitive data in any database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Siyuan Feng", email = "sealseacat@gmail.com" }]
keywords = ["data-masking", "pii", "anonymization", "etl", "privacy", "gdpr", "test-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Core dependencies are intentionally light. Database drivers and LLM SDKs are
# optional extras so users only install what they actually need.
dependencies = [
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/sealandseacat/dbmask"
Repository = "https://github.com/sealandseacat/dbmask"
Issues = "https://github.com/sealandseacat/dbmask/issues"
Changelog = "https://github.com/sealandseacat/dbmask/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Database drivers (install the one(s) you need)
postgres = ["psycopg2-binary>=2.9"]
mysql = ["PyMySQL>=1.1"]
mssql = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
# everything-database meta extra
databases = ["psycopg2-binary>=2.9", "PyMySQL>=1.1", "pyodbc>=5.0", "oracledb>=2.0"]

# Local history spreadsheets
excel = ["openpyxl>=3.1.5"]

# LLM providers
openai = ["openai>=1.0", "tiktoken>=0.5"]
local = ["requests>=2.31"]

# Convenience: install everything
all = [
    "psycopg2-binary>=2.9", "PyMySQL>=1.1", "pyodbc>=5.0", "oracledb>=2.0",
    "openai>=1.0", "tiktoken>=0.5", "requests>=2.31", "openpyxl>=3.1.5",
]

dev = [
    "openpyxl>=3.1.5",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    # mypy 2.x dropped --python-version 3.9; stay on 1.x until our floor moves.
    "mypy>=1.14,<2",
    "types-PyYAML",
    "types-requests",
    # so the LocalProvider tests run instead of being importorskip'd away
    "requests>=2.31",
]

[project.scripts]
dbmask = "dbmask.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbmask = ["py.typed", "masking/dictionaries/data/*.txt"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: docs/tables read better unwrapped
    "UP007",  # keep Optional[X] spelling while 3.9 is supported
    "UP045",
]

[tool.mypy]
python_version = "3.9"
files = ["src/dbmask"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false  # ignores differ between local/CI stub sets
no_implicit_optional = true
[[tool.mypy.overrides]]
module = ["click.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dbmask"]

[tool.coverage.report]
show_missing = false
precision = 0
