name: "Evidence: Ota PostgreSQL pressure (non-blocking)"

on:
  push:
    branches: [bobai/postgres-pressure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-ci-drift:
    name: Contract-to-CI drift
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare bounded contract truth with repository CI
        id: drift
        continue-on-error: true
        uses: ota-run/action@8001070c0c9e54ca2b729282df40d1a9f40c8a79 # v1.0.16
        with:
          command: doctor
          source: contract
          fail-on-error: false
          fail-on-ci-drift: true
          comment-pr: false
      - name: Preserve the drift-check outcome
        if: always()
        shell: bash
        run: test "${{ steps.drift.outcome }}" = success

  native:
    name: Ota contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare retained evidence
        shell: bash
        run: mkdir -p ota-pressure/native
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Validate the contract
        shell: bash
        run: ota validate . 2>&1 | tee ota-pressure/native/validate.txt
      - name: Preview the selected contributor graph
        shell: bash
        run: ota up --workflow contributor --native --agent --dry-run . --json > ota-pressure/native/up-dry-run.json
      - name: Run the repository-owned SQLite contributor suite
        shell: bash
        run: ota run test --native --agent --stream . 2>&1 | tee ota-pressure/native/test.txt
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbmask-ota-${{ matrix.os }}
          path: ota-pressure/native/
          if-no-files-found: error

  postgresql:
    name: Ota PostgreSQL pressure (linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297 # 16.10-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: dbmask
          POSTGRES_PASSWORD: dbmask-pressure-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbmask -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBMASK_SOURCE_URL: postgresql+psycopg2://dbmask:dbmask-pressure-only@localhost:5432/dbmask_source
      DBMASK_TARGET_URL: postgresql+psycopg2://dbmask:dbmask-pressure-only@localhost:5432/dbmask_target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare retained evidence
        shell: bash
        run: mkdir -p ota-pressure/postgresql
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml
      - name: Validate the contract
        shell: bash
        run: ota validate . 2>&1 | tee ota-pressure/postgresql/validate.txt
      - name: Preview the selected PostgreSQL graph
        shell: bash
        run: ota up --workflow postgres-pressure --native --dry-run . --json > ota-pressure/postgresql/up-dry-run.json
      - name: Exercise disposable PostgreSQL state and strict-validation controls
        shell: bash
        run: ota run postgres:verify --native --stream . 2>&1 | tee ota-pressure/postgresql/postgres-verify.txt
      - name: Retain PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbmask-ota-postgresql
          path: ota-pressure/postgresql/
          if-no-files-found: error
