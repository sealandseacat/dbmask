site_name: dbmask
site_description: >-
  Discover, mask, and validate sensitive data in SQL databases — one
  auditable workflow.
site_url: https://sealandseacat.github.io/dbmask/
repo_url: https://github.com/sealandseacat/dbmask
repo_name: sealandseacat/dbmask
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Configuration: configuration.md
      - Historical decisions: history.md
      - Pattern detection: detection.md
      - Masking strategies: strategies.md
      - Mixed-format demo: issue36-demo.md
      - The seed map: seed-map.md
      - Validation: validation.md
      - LLM detection: llm.md
  - Concepts:
      - Architecture: architecture.md
      - Security model: security-model.md
  - Project:
      - Roadmap: roadmap.md
