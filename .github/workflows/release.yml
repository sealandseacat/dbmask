name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — no API keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite against the tagged commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
      - name: Validate metadata
        run: twine check --strict dist/*
      - name: Publish to PyPI (trusted publishing)
        # Pinned to a commit SHA, not a moving tag: this job holds
        # id-token: write, so a hijacked tag could publish to PyPI as us.
        # Dependabot (github-actions ecosystem) keeps the pin current.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
